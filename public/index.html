<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdVanced OS — Mission Control</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #10161f; --panel2: #0d1219; --line: #1c2734;
    --green: #2dce89; --gold: #ffd700; --text: #c7d0da; --dim: #6b7885;
    --blue: #3b82f6; --red: #ef4444; --orange: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  a { color: var(--green); }
  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: linear-gradient(90deg, #0d1a14, var(--panel));
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 8px currentColor; color: var(--dim); }
  .dot.ok { background: var(--green); color: var(--green); }
  .dot.warn { background: var(--orange); color: var(--orange); }
  .dot.bad { background: var(--red); color: var(--red); }
  h1 { font-size: 16px; margin: 0; letter-spacing: 1px; color: var(--gold); font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .badge { padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); }
  .badge.pass { color: var(--green); border-color: var(--green); }
  .badge.trip { color: var(--red); border-color: var(--red); }
  .spacer { flex: 1; }
  .spendbar { width: 200px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; background: var(--green); transition: width .4s; }
  .bar.hot > i { background: var(--orange); }
  .bar.over > i { background: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px; max-width: 1400px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .panel > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin: 0 0 12px; }
  .muted { color: var(--dim); font-style: italic; }
  /* workers */
  .workers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .workers-grid { grid-template-columns: 1fr; } }
  .wcard { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .wcard .head { display: flex; align-items: center; gap: 10px; }
  .wcard .icon { width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; background: #14231a; font-size: 20px; }
  .wcard.active .icon { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(45,206,137,.5); } 50% { box-shadow: 0 0 0 5px rgba(45,206,137,0); } }
  .wcard .name { font-weight: 600; color: var(--text); }
  .wcard .meta { color: var(--dim); font-size: 11px; }
  .dispatch { display: flex; gap: 6px; }
  .dispatch textarea { flex: 1; resize: vertical; min-height: 34px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; font-size: 12px; }
  .dispatch textarea:focus { outline: none; border-color: var(--green); }
  .dispatch button { align-self: stretch; padding: 0 12px; background: #14231a; color: var(--green); border: 1px solid var(--green); border-radius: 5px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
  .dispatch button:hover { background: var(--green); color: var(--bg); }
  .dispatch button:disabled { opacity: .5; cursor: default; }
  .dispatch button.sent { background: var(--red); color: var(--bg); border-color: var(--red); }
  .dispatch button.sent:hover { background: var(--red); color: var(--bg); }
  /* pending dispatches */
  .req { padding: 6px 8px; border-left: 3px solid var(--blue); background: var(--panel2); margin-bottom: 4px; font-size: 12.5px; }
  .req .a { color: var(--gold); font-weight: 600; }
  .req .t { color: var(--dim); }
  /* toast */
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--green); color: var(--green); padding: 10px 16px; border-radius: 6px; opacity: 0; transform: translateY(8px); transition: .3s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { border-color: var(--red); color: var(--red); }
  .pill { margin-left: auto; padding: 3px 10px; border-radius: 12px; font-size: 11px; text-transform: uppercase; }
  .pill.active { background: rgba(45,206,137,.15); color: var(--green); }
  .pill.idle   { background: rgba(107,120,133,.15); color: var(--dim); }
  .pill.offline { background: rgba(107,120,133,.08); color: #5a6570; }
  .pill.dead, .pill.error { background: rgba(239,68,68,.15); color: var(--red); }
  .pill.unknown { background: rgba(245,158,11,.15); color: var(--orange); }
  /* events */
  #events { max-height: 340px; overflow-y: auto; }
  .ev { display: grid; grid-template-columns: 62px 90px 1fr; gap: 8px; padding: 5px 6px; border-left: 3px solid var(--dim); margin-bottom: 3px; font-size: 12.5px; background: var(--panel2); }
  .ev .t { color: var(--dim); }
  .ev .a { color: var(--gold); }
  .ev.dispatch { border-color: var(--blue); }
  .ev.complete, .ev.qa_pass, .ev.approve, .ev.deploy, .ev.start { border-color: var(--green); }
  .ev.fail, .ev.qa_fail, .ev.deny { border-color: var(--red); }
  .ev.circuit_break, .ev.stop { border-color: var(--orange); }
  /* cost */
  .kv { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--line); }
  .kv b { color: var(--gold); }
  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 400; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  .st { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .st.ok { background: rgba(45,206,137,.15); color: var(--green); }
  .st.fail { background: rgba(239,68,68,.15); color: var(--red); }
  .foot { color: var(--dim); font-size: 11px; padding: 0 20px 20px; }
  /* live output */
  #livePanel { margin: 0 20px 16px; max-width: 1400px; }
  #livePanel .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #livePanel .head h2 { margin: 0; }
  #liveSelect { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                border-radius: 5px; padding: 4px 8px; font: inherit; font-size: 12px; }
  #liveSelect:focus { outline: none; border-color: var(--green); }
  .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
  #liveOut { max-height: 400px; overflow-y: auto; background: var(--panel2); border: 1px solid var(--line);
             border-radius: 6px; padding: 10px 12px; margin: 0; white-space: pre-wrap; word-break: break-word;
             font-size: 12px; line-height: 1.45; color: var(--text); }
</style>
</head>
<body>
  <div class="topbar">
    <span id="sysdot" class="dot"></span>
    <h1>AdVanced OS <small>— Mission Control</small></h1>
    <span id="cbBadge" class="badge">—</span>
    <div class="spacer"></div>
    <div class="spendbar">
      <div id="spendLabel" class="meta" style="font-size:12px;color:var(--dim)">$0.00 / $20.00</div>
      <div id="spendBar" class="bar"><i style="width:0%"></i></div>
    </div>
  </div>

  <div id="livePanel" class="panel">
    <div class="head">
      <span id="liveDot" class="dot"></span>
      <h2>Live Output — <span id="liveAgentName">Belial</span></h2>
      <select id="liveSelect" onchange="renderLive()">
        <option value="claude-belial">Belial</option>
        <option value="claude-obsoletebot">ObsoleteBot</option>
        <option value="claude-remote-control">Remote Control</option>
        <option value="hermes">Azrael</option>
      </select>
    </div>
    <pre id="liveOut">Waiting for output…</pre>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Agents</h2>
      <div id="workers"><div class="muted">Loading…</div></div>
    </div>

    <div class="panel">
      <h2>Pending Dispatches</h2>
      <div id="pending"><div class="muted">No pending dispatches</div></div>
    </div>

    <div class="panel">
      <h2>Event Feed</h2>
      <div id="events"><div class="muted">No events yet</div></div>
    </div>

    <div class="panel">
      <h2>Cost — This Week</h2>
      <div id="cost"><div class="muted">No cost data yet</div></div>
    </div>

    <div class="panel">
      <h2>Cron Jobs</h2>
      <div id="cron"><div class="muted">Loading…</div></div>
    </div>
  </div>

  <div class="foot">Polling every 5s · <span id="stamp">—</span> · <a href="/api/health">health</a></div>
  <div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hhmm = ts => (ts && ts.length >= 16) ? ts.slice(11, 16) : "—";
const ICON = {"Belial":"⚔️","ObsoleteBot":"🤖","Remote Control":"📡","Azrael":"🕊️"};

let toastTimer;
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 3000);
}

async function dispatch(btn) {
  const ta = btn.previousElementSibling;
  const task = ta.value.trim();
  if (!task) { toast("Enter a task first", true); return; }
  btn.disabled = true;
  try {
    const r = await fetch("/api/dispatch", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({agent: ta.dataset.agent, task, priority: "normal"}),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { toast("Queued → " + ta.dataset.agent); ta.value = ""; btn.classList.add("sent"); renderPending(await getJSON("/api/dispatch/pending")); }
    else toast(j.error || "Dispatch failed", true);
  } catch (e) { toast("Dispatch failed", true); }
  finally { btn.disabled = false; }
}

function renderPending(reqs) {
  const box = $("#pending");
  if (!reqs || !reqs.length) { box.innerHTML = '<div class="muted">No pending dispatches</div>'; return; }
  box.innerHTML = reqs.map(r => `
    <div class="req">
      <span class="a">${esc(r.agent)}</span>
      <span class="t">${esc(hhmm(r.created_at))} · ${esc(r.priority)}</span>
      <div>${esc(r.task)}</div>
    </div>`).join("");
}

// Red button = a dispatch for that agent is still queued (unacknowledged).
// Green once the consumer delivers it to tmux and clears the request file.
function paintDispatchButtons(pending) {
  const busy = new Set((pending || []).map(r => r.agent));
  document.querySelectorAll(".dispatch button").forEach(btn => {
    btn.classList.toggle("sent", busy.has(btn.previousElementSibling?.dataset.agent));
  });
}

async function getJSON(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}

function renderStatus(s) {
  if (!s || s.error) {
    $("#sysdot").className = "dot warn";
    $("#cbBadge").textContent = "NO SNAPSHOT";
    $("#cbBadge").className = "badge";
    $("#workers").innerHTML = '<div class="muted">' + esc(s?.error || "no data") + '</div>';
    $("#cron").innerHTML = '<div class="muted">no data</div>';
    return;
  }
  const cb = s.circuit_breaker || {};
  const tripped = cb.status === "TRIPPED";
  $("#sysdot").className = "dot " + (tripped ? "bad" : "ok");
  $("#cbBadge").textContent = tripped ? "TRIPPED" : "PASS";
  $("#cbBadge").className = "badge " + (tripped ? "trip" : "pass");

  const sp = cb.spend || {};
  const pct = Math.min(100, sp.pct || 0);
  $("#spendLabel").textContent = `$${(sp.weekly ?? 0).toFixed(2)} / $${(sp.cap ?? 0).toFixed(2)} (${(sp.pct ?? 0).toFixed(1)}%)`;
  const bar = $("#spendBar");
  bar.className = "bar" + (pct >= 100 ? " over" : pct >= 75 ? " hot" : "");
  bar.firstElementChild.style.width = pct + "%";

  const ws = s.workers || [];
  // Don't clobber a textarea the user is typing in on the 5s poll.
  if (!$("#workers").contains(document.activeElement))
  $("#workers").innerHTML = ws.length ? '<div class="workers-grid">' + ws.map(w => `
    <div class="wcard ${w.status === "active" ? "active" : ""}">
      <div class="head">
        <div class="icon">${ICON[w.name] || "🛰️"}</div>
        <div>
          <div class="name">${esc(w.name)}</div>
          <div class="meta">${esc(w.model)} · ${esc(w.effort)}</div>
        </div>
        <span class="pill ${esc(w.status)}">${esc(w.status)}</span>
      </div>
      <div class="meta">${esc(w.project)} · ${esc(w.session)}</div>
      <div class="dispatch">
        <textarea placeholder="Dispatch a task to ${esc(w.name)}…" data-agent="${esc(w.session)}"></textarea>
        <button onclick="dispatch(this)">Dispatch</button>
      </div>
    </div>`).join("") + '</div>' : '<div class="muted">No agents detected</div>';

  $("#cron").innerHTML = `<table>
    <tr><th>Job</th><th>Schedule</th><th>Last run</th><th>Status</th></tr>
    ${(s.cron_jobs || []).map(c => `<tr>
      <td>${esc(c.name)}</td><td>${esc(c.schedule)}</td>
      <td>${esc(hhmm(c.last_run))}</td>
      <td><span class="st ${c.last_status === "ok" ? "ok" : "fail"}">${esc(c.last_status)}</span></td>
    </tr>`).join("")}
  </table>`;

  $("#stamp").textContent = "snapshot " + esc(hhmm(s.generated_at));
}

function renderEvents(evs) {
  const box = $("#events");
  if (!evs || !evs.length) { box.innerHTML = '<div class="muted">No events yet</div>'; return; }
  box.innerHTML = evs.map(e => `
    <div class="ev ${esc(e.event)}">
      <span class="t">${esc(hhmm(e.ts))}</span>
      <span class="a">${esc(e.agent)}</span>
      <span>${esc(e.detail) || '<span class="muted">' + esc(e.event) + '</span>'}</span>
    </div>`).join("");
  box.scrollTop = box.scrollHeight;
}

function renderCost(c) {
  const box = $("#cost");
  if (!c || (!c.task_count && !Object.keys(c.by_worker || {}).length)) {
    box.innerHTML = '<div class="muted">No cost data yet</div>'; return;
  }
  const workers = Object.entries(c.by_worker || {})
    .map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>$${v.spend.toFixed(2)}</b> <span class="muted">${v.tasks} task(s)</span></div>`)
    .join("");
  box.innerHTML = `
    <div class="kv"><span>Weekly spend</span><b>$${(c.total_spend ?? 0).toFixed(2)}</b></div>
    <div class="kv"><span>Cap</span><b>$${(c.cap ?? 0).toFixed(2)}</b></div>
    <div class="kv"><span>Remaining</span><b>$${(c.remaining ?? 0).toFixed(2)}</b></div>
    <div class="kv"><span>Tasks</span><b>${c.task_count ?? 0}</b></div>
    <div style="margin-top:10px" class="meta">By worker</div>
    ${workers || '<div class="muted">—</div>'}
    <div style="margin-top:8px" class="muted">Trend vs last week: — (placeholder)</div>`;
}

async function renderLive() {
  const sel = $("#liveSelect"), dot = $("#liveDot"), pre = $("#liveOut");
  $("#liveAgentName").textContent = sel.options[sel.selectedIndex].text;
  const j = await getJSON(`/api/agent/session?session=${encodeURIComponent(sel.value)}&lines=20`);
  // No session yet (e.g. Azrael, which runs as Hermes, not a tmux session).
  if (!j || j.error) {
    dot.className = "dot bad";
    pre.textContent = "Agent not online — session may be starting…";
    return;
  }
  // green pulse = active, dim = idle.
  dot.className = "dot " + (j.status === "active" ? "pulse ok" : "");
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  pre.textContent = j.output || "Waiting for output…";
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

async function tick() {
  renderLive();
  const [s, e, c, p] = await Promise.all([
    getJSON("/api/status"),
    getJSON("/api/events?limit=50"),
    getJSON("/api/cost/summary"),
    getJSON("/api/dispatch/pending"),
  ]);
  renderStatus(s);
  renderEvents(e);
  renderCost(c);
  renderPending(p);
  paintDispatchButtons(p);
}

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
