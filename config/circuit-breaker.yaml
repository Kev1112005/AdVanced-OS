# Circuit Breaker Configuration
# AdVanced OS — Phase 2
# Parsed line-by-line with grep/awk (no yq). Keep keys flat & values simple.

spend_cap:
  weekly_usd: 20.0          # Per-week dollar limit. Hermes stops dispatching when hit.
  log_file: "~/.hermes/logs/cost-log.csv"  # Phase 1c cost log location

dispatch_depth:
  max: 3                    # Max chained dispatches from a single request. Kill at 4.
  correlation_id_prefix: ""  # Hermes correlation ID prefix if any

time_cap:
  max_minutes: 30           # If task exceeds this, checkpoint and ask Kevin to confirm
  check_interval_seconds: 60

global_stop:
  flag_file: "~/.hermes/stop"     # Disk-based flag outside /tmp (survives reboot)
  message: "HERMES STOPPED by global stop flag"

alerts:
  channel: "discord:#officers"    # Legacy label — human-readable target
  channel_id: "1523120048233906266"  # Discord channel for alerts
  # webhook_url stays EMPTY in the committed repo — the URL is sensitive.
  # Set the real value via the HERMES_ALERT_WEBHOOK env var, or write it to
  # ~/.hermes/alert-webhook (gitignored). hermes-alert.sh checks those first.
  webhook_url: ""
  warn_at_pct: 50                 # spend % of cap → warn alert
  alert_at_pct: 75                # spend % of cap → alert
  critical_at_pct: 90             # spend % of cap → critical alert
  cron_failure_threshold: 3       # N consecutive failures → alert (cron + dispatch)
  agent_death_cooldown: 300       # seconds between duplicate agent-death alerts
